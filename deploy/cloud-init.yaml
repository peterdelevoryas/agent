#cloud-config
# First-boot setup for the agent VM. The binary itself is built and installed
# by deploy.sh. The conversation and the agent's working directory live on a
# volume whose ext4 filesystem is labeled agent-data; it's mounted at
# /var/lib/agent whenever it's attached (nofail: the machine still boots
# without it, and the service then refuses to start rather than run on an
# empty directory). There's no public service: relays reach /input over the
# private network, so only SSH is open to the internet.
package_update: true
package_upgrade: true
packages:
  - build-essential
  - pkg-config
  - libssl-dev
  - rsync
  - git
  - jq
  - ripgrep
  - ufw
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
users:
  - default
  - name: agent
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
mounts:
  - [LABEL=agent-data, /var/lib/agent, ext4, "defaults,nofail,discard", "0", "2"]
runcmd:
  # Rust toolchain for building on the box.
  - curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal
  # /input only from the private network, where the relays are.
  - ufw allow OpenSSH && ufw allow from 10.0.0.0/16 to any port 8770 proto tcp && ufw --force enable
  - install -d -o root -g agent -m 0750 /etc/agent
  # The agent has full root on its own VM.
  - echo 'agent ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/agent && chmod 0440 /etc/sudoers.d/agent && visudo -cf /etc/sudoers.d/agent
  # The agent user's uid can differ from the machine that wrote the volume.
  - if mountpoint -q /var/lib/agent; then chown agent:agent /var/lib/agent && chmod 0700 /var/lib/agent && find /var/lib/agent -mindepth 1 -maxdepth 1 ! -name lost+found -exec chown -R agent:agent {} +; fi
