[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = "0.4.45"
libc = "0.2.189"
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "=3.4.1", features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turso = "=0.7.2"
